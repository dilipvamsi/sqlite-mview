name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ==================================================================
          # LINUX BUILDS
          # ==================================================================

          # 1. Linux x64
          - os: ubuntu-latest
            target: linux-x64
            asset_name: mview-linux-x64.so
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y libsqlite3-dev
            build_cmd: make

          # 2. Linux ARM64
          - os: ubuntu-latest
            target: linux-arm64
            asset_name: mview-linux-arm64.so
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            # Override CC to use the cross-compiler
            build_cmd: make CC=aarch64-linux-gnu-gcc

          # ==================================================================
          # WINDOWS BUILDS (Cross-compiled from Linux)
          # ==================================================================

          # 3. Windows x64 (Standard)
          - os: ubuntu-latest
            target: windows-x64
            asset_name: mview-windows-x64.dll
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y mingw-w64
              # Fix: Download SQLite header
              curl -O https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
              unzip -q sqlite-amalgamation-3420000.zip
              mv sqlite-amalgamation-3420000/sqlite3.h .
              mv sqlite-amalgamation-3420000/sqlite3ext.h .
            build_cmd: make windows

          # 4. Windows x86 (32-bit)
          - os: ubuntu-latest
            target: windows-x86
            asset_name: mview-windows-x86.dll
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y mingw-w64
              # Fix: Download SQLite header
              curl -O https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
              unzip -q sqlite-amalgamation-3420000.zip
              mv sqlite-amalgamation-3420000/sqlite3.h .
              mv sqlite-amalgamation-3420000/sqlite3ext.h .
            build_cmd: make CC=i686-w64-mingw32-gcc TARGET_LIB=build/mview.dll LDFLAGS="-shared"

          # 5. Windows ARM64 (LLVM-MinGW)
          - os: ubuntu-latest
            target: windows-arm64
            asset_name: mview-windows-arm64.dll
            install_deps: |
              curl -L -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
              tar -xf llvm-mingw.tar.xz
              echo "$PWD/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
              # Fix: Download SQLite header
              curl -O https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
              unzip -q sqlite-amalgamation-3420000.zip
              mv sqlite-amalgamation-3420000/sqlite3.h .
              mv sqlite-amalgamation-3420000/sqlite3ext.h .
            build_cmd: make CC=aarch64-w64-mingw32-gcc TARGET_LIB=build/mview.dll LDFLAGS="-shared"

          # ==================================================================
          # MACOS BUILD (Universal: Intel + Apple Silicon)
          # ==================================================================

          # 6. macOS Universal
          - os: macos-latest
            target: macos-universal
            asset_name: mview-macos-universal.dylib
            install_deps: |
              curl -O https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip
              unzip -q sqlite-amalgamation-3420000.zip
              mv sqlite-amalgamation-3420000/sqlite3.h .
              mv sqlite-amalgamation-3420000/sqlite3ext.h .
            # Uses the Makefile's 'macos_universal' target
            build_cmd: make macos_universal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: ${{ matrix.install_deps }}

      - name: Compile Extension
        run: ${{ matrix.build_cmd }}

      - name: Strip Debug Symbols
        run: |
          cd build

          if [[ "${{ matrix.target }}" == "windows-arm64" ]]; then
            # Windows ARM64 (LLVM)
            aarch64-w64-mingw32-strip --strip-unneeded mview.dll

          elif [[ "${{ matrix.target }}" == "linux-arm64" ]]; then
            # FIX: Linux ARM64 (Uses the specific cross-strip tool)
            aarch64-linux-gnu-strip --strip-unneeded mview.so

          elif [[ "${{ matrix.target }}" == *"windows"* ]]; then
            # Windows x86/x64 (Standard MinGW strip)
            strip --strip-unneeded mview.dll

          elif [[ "${{ matrix.target }}" == "linux-x64" ]]; then
            # Linux x64 (Standard system strip)
            strip --strip-unneeded mview.so
          fi
          # macOS does not require explicit stripping here (handled by linker usually)

      - name: Prepare Artifacts
        run: |
          cd build

          # Rename output file to match the asset name defined in the matrix
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            mv mview.dll ../${{ matrix.asset_name }}
          elif [[ "${{ matrix.target }}" == *"macos"* ]]; then
            mv mview.dylib ../${{ matrix.asset_name }}
          else
            mv mview.so ../${{ matrix.asset_name }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
